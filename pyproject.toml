[tool.black]
line-length = 160
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM"]
ignore = [
    "E701",  # multiple statements on one line (colon) - existing dense style
    "E702",  # multiple statements on one line (semicolon) - existing dense style
    "E501",  # line too long - many wide Qt layout lines; length is capped separately above
]

[tool.ruff.lint.per-file-ignores]
"smetagaz/__main__.py" = ["F401"]
